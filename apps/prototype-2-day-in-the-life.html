<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Next Step: A Day You'd Actually Want</title>
<link rel="icon" type="image/svg+xml" href="assets/yns-mark.svg">
<link rel="apple-touch-icon" href="assets/yns-mark.svg">
<script src="yns-theme.js?v=02f59ec1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Questrial&display=swap">
<link rel="stylesheet" href="yns-brand.css?v=f1642f27">
<style>
  :root{
    /* Surfaces, so dark mode has something to swap. These were
       literal var(--paper) before — correct in light, invisible in dark. */
    --paper:#fff; --body:#3b4256; --tint-2:#dfe4fb;
    --note-bg:var(--note-bg); --note-line:var(--note-line); --note-ink:var(--note-ink);
    --blue:#2952e0; --blue-dark:#1b3aa8; --blue-soft:#eef1fe;
    --ink:#101426; --muted:#6b7280; --line:#e4e7f2; --bg:#f7f8fc; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Poppins",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:28px 18px 80px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;
    padding:0 0 30px;box-shadow:0 2px 20px rgba(20,30,80,.05);overflow:hidden}
  .pad{padding:0 32px}

  /* ---- the day timeline ---- */
  .daybar{padding:22px 32px 18px;border-bottom:1px solid var(--line);background:#fbfcff}
  .track{position:relative;height:3px;background:var(--line);border-radius:99px;margin:26px 0 8px}
  .fill{position:absolute;left:0;top:0;height:3px;background:var(--blue);border-radius:99px;
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pip{position:absolute;top:-5.5px;width:14px;height:14px;border-radius:50%;
    background:var(--paper);border:2.5px solid var(--line);transform:translateX(-50%);transition:.4s}
  .pip.done{border-color:var(--blue);background:var(--blue)}
  .pip.now{border-color:var(--blue);background:var(--paper);box-shadow:0 0 0 5px rgba(41,82,224,.14)}
  .pip span{position:absolute;top:20px;left:50%;transform:translateX(-50%);
    font-size:10.5px;color:var(--muted);white-space:nowrap;font-weight:600}
  .pip.now span{color:var(--blue-dark)}
  .sun{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    letter-spacing:.1em;text-transform:uppercase;font-weight:600}

  .clock{font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--blue);font-weight:700;margin:26px 0 8px}
  h1{font-size:29px;line-height:1.2;margin:0 0 12px}
  h2{font-size:24px;line-height:1.28;margin:0 0 12px}
  .scene{font-size:16px;line-height:1.65;color:var(--body);margin:0 0 8px}
  .scene em{color:var(--ink);font-style:normal;font-weight:600}
  .prompt{font-size:15.5px;font-weight:600;margin:20px 0 13px}

  .choice{display:block;width:100%;text-align:left;cursor:pointer;background:var(--paper);
    border:1.5px solid var(--line);border-radius:var(--radius);padding:15px 18px;
    margin-bottom:10px;font:inherit;color:inherit;transition:.14s}
  .choice:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
  .choice .t{font-weight:600;font-size:15.5px;display:block}
  .choice .s{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.5}

  .echo{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--muted);line-height:1.7}
  .echo b{color:var(--body);font-weight:600}

  .back{background:none;border:none;color:var(--muted);font:inherit;font-size:13.5px;
    cursor:pointer;padding:9px 0;margin-top:12px}
  .back:hover{color:var(--blue)}

  /* ---- results ---- */
  .shape{display:flex;gap:5px;align-items:flex-end;height:78px;margin:20px 0 8px}
  .shape div{flex:1;background:var(--blue-soft);border-radius:6px 6px 0 0;position:relative;
    border-bottom:2px solid var(--blue)}
  .shape div i{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);
    font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
  .shapewrap{margin-bottom:34px}

  .result-card{border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px}
  .result-card.best{border-color:var(--blue);background:var(--blue-soft)}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;padding:5px 10px;border-radius:99px;background:var(--blue);color:#fff;margin-bottom:10px}
  .tag.alt{background:var(--tint-2);color:var(--blue-dark)}
  .result-card h3{margin:0 0 6px;font-size:20px}
  .result-card .why{font-size:14px;color:var(--body);line-height:1.6;margin:0 0 8px}
  .fitline{font-size:13px;color:var(--blue-dark);font-weight:600;margin:0 0 14px}
  .roles{border-top:1px solid rgba(41,82,224,.15);padding-top:12px}
  .roles .rh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--blue-dark);font-weight:700;margin-bottom:8px}
  .role{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px;
    border-bottom:1px solid rgba(41,82,224,.08)}
  .role:last-child{border-bottom:none}
  .role .pay{font-weight:600;color:var(--blue-dark)}

  .cta{margin-top:26px;padding:24px;background:var(--ink);border-radius:var(--radius);color:#fff;text-align:center}
  .cta h3{margin:0 0 8px;font-size:19px}
  .cta p{margin:0 0 16px;font-size:14px;color:#b9bfd4;line-height:1.6}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;
    padding:13px 24px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .btn:hover{background:#3a61f0}
  .emailrow{display:flex;gap:8px;margin-bottom:14px}
  .emailrow input{flex:1;padding:13px 14px;border-radius:10px;border:1px solid #39405c;
    background:#1b2138;color:#fff;font:inherit;font-size:14px}
  .emailrow input::placeholder{color:#7a8199}

  .fade{animation:fade .38s ease}
  @keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .note{max-width:660px;margin:0 auto 18px;padding:12px 16px;background:var(--note-bg);
    border:1px solid var(--note-line);border-radius:10px;font-size:13px;color:var(--note-ink);line-height:1.6}

  /* ---- dark ----------------------------------------------------------
     These three pages predate yns-brand.css and carry their own palette,
     so they need their own swap. Same rules as the brand sheet: the
     media query must lose to an explicit light choice, the attribute
     selector must beat an OS that says light, hence both.

     The results panel is left alone on purpose. It is already dark by
     design in both themes — that inversion is what makes the result feel
     like an arrival rather than another question. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --blue:#6E9BFF; --blue-dark:#9DBBFF; --blue-soft:#1E2A40;
      --ink:#E8ECF4; --muted:#9AA6BC; --line:#2C3850; --bg:#0D1523;
      --paper:#161F30; --body:#C3CCDC; --tint-2:#2A3A57;
      --note-bg:#2E2A17; --note-line:#4A4324; --note-ink:#E4D9A6;
    }
  }
  :root[data-theme="dark"]{
    --blue:#6E9BFF; --blue-dark:#9DBBFF; --blue-soft:#1E2A40;
    --ink:#E8ECF4; --muted:#9AA6BC; --line:#2C3850; --bg:#0D1523;
    --paper:#161F30; --body:#C3CCDC; --tint-2:#2A3A57;
    --note-bg:#2E2A17; --note-line:#4A4324; --note-ink:#E4D9A6;
  }
  /* Text that sat on the blue button/badge: the blue is light now. */
  :root[data-theme="dark"] .btn, :root[data-theme="dark"] button.btn { color:#0D1523 }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .btn { color:#0D1523 }
  }
</style>
</head>
<body>


<div class="wrap">
  <div id="resume"></div>
  <div class="card" id="app" role="region" aria-live="polite" aria-label="Career quiz"></div>
</div>

<script src="yns-config.js?v=3ceff94a"></script>
<script src="yns-supabase.js?v=d872a971"></script>
<script src="yns-taxonomy.js?v=4bb570b3"></script>
<script src="yns-profile.js?v=a23328d5"></script>
<script src="quiz-shared.js?v=ee3e8651"></script>
<script>
if(!window.Quiz){
  document.getElementById('app').innerHTML =
    '<div class="pad"><h2>quiz-shared.js didn\'t load</h2><p class="scene">Keep this file in the same folder as <b>quiz-shared.js</b> and reload.</p></div>';
  throw new Error('quiz-shared.js missing');
}
/* Resolves once we know what previous activities learned about this
   person. Rendering waits on it — see the bottom of this file. */
const READY = Quiz.init('dayinlife');






/* ---------------- the day ---------------- */
const MOMENTS = [
{
  time:"8:52 am", pip:"8:52",
  title:"You're early, and the day hasn't started yet.",
  scene:["Coffee's still too hot. Nobody needs anything from you for eight more minutes.",
         "You open one thing to get a head start on."],
  prompt:"What do you open?",
  options:[
   {t:"The message from someone who's struggling", s:"You've been thinking about it since last night.",
    echo:"you start the day with a person", a:{people:3, order:1}},
   {t:"The report nobody's made sense of yet", s:"There's a pattern in there. You want to find it.",
    echo:"you start the day inside a problem", a:{analysis:3, order:1}},
   {t:"The draft you left half-finished", s:"You know exactly what's wrong with it now.",
    echo:"you start the day making something", a:{making:3, analysis:1}},
   {t:"The plan for the week", s:"Five people, three deadlines. You want it locked before anyone else is online.",
    echo:"you start the day getting ahead of everyone", a:{leading:3, order:2}},
   {t:"The job list and the truck keys", s:"Three sites today. You want to be moving before traffic.",
    echo:"you start the day already moving", a:{hands:3, order:1}}
  ]
},
{
  time:"10:30 am", pip:"10:30",
  title:"You get pulled into a room.",
  scene:["Six people, one whiteboard, a decision that has to get made today.",
         "Twenty minutes in, you notice you've settled into a role without meaning to."],
  prompt:"Which one is you?",
  options:[
   {t:"The one asking the quiet person what they think", s:"Half the room hasn't said anything. You notice.",
    echo:"you make room for people", a:{people:3, leading:1}},
   {t:"The one saying 'wait, is that actually true?'", s:"Someone stated an assumption as fact. You want to check it.",
    echo:"you check the assumptions", a:{analysis:3, order:1}},
   {t:"The one at the whiteboard drawing it", s:"They're going in circles because nobody can see it yet.",
    echo:"you make the abstract visible", a:{making:3, leading:1}},
   {t:"The one saying 'okay, here's what we're doing'", s:"It's been forty minutes. Someone has to call it.",
    echo:"you call it when nobody else will", a:{leading:3, order:1}},
   {t:"The one thinking about who actually has to do this", s:"It sounds great in a room. It has to survive contact with Tuesday.",
    echo:"you think about who does the work", a:{order:3, hands:1, people:1}}
  ]
},
{
  time:"12:40 pm", pip:"12:40",
  title:"Lunch. Forty minutes that are yours.",
  scene:["You've done half a day. You can feel which parts drained you and which parts didn't.",
         "There's one thing that would put the charge back."],
  prompt:"What actually restores you?",
  options:[
   {t:"Eating with someone and properly talking", s:"Not networking. Talking.",
    echo:"people recharge you", a:{people:3}},
   {t:"Being completely alone with your own head", s:"A walk. No podcast. Nothing needing you.",
    echo:"solitude recharges you", a:{analysis:2, making:1, order:1}},
   {t:"Twenty minutes on something you're making for yourself", s:"Nothing to do with work. That's the point.",
    echo:"making things recharges you", a:{making:3}},
   {t:"Clearing the small stuff so the afternoon is clean", s:"Inbox to zero. You'll think better.",
    echo:"order recharges you", a:{order:3, leading:1}},
   {t:"Moving your body until your head clears", s:"Gym, walk, anything physical.",
    echo:"moving recharges you", a:{hands:3}}
  ]
},
{
  time:"2:15 pm", pip:"2:15",
  title:"The hardest part of the day.",
  scene:["Every job has one stretch that's genuinely difficult. Not annoying. <em>Difficult</em>.",
         "This is the one you'd want, if you had to have one."],
  prompt:"Which hard thing would you pick?",
  options:[
   {t:"Telling someone something they don't want to hear", s:"And staying in the room afterwards.",
    echo:"you'll take the hard conversation", a:{people:2, leading:2}},
   {t:"Sitting with a problem that hasn't cracked yet", s:"Three hours in and still nothing. You keep going.",
    echo:"you'll take the unsolved problem", a:{analysis:3, order:1}},
   {t:"Throwing out good work and starting again", s:"It's fine, but it isn't right, and you know the difference.",
    echo:"you'll throw out good work to get it right", a:{making:3, order:1}},
   {t:"Owning a call that might be wrong", s:"Not enough information, and it's still yours to make.",
    echo:"you'll own the risky call", a:{leading:3}},
   {t:"Physical work that has to be done exactly right", s:"No shortcuts, no approximations, and it's on you.",
    echo:"you'll take the work that must be exact", a:{hands:3, order:2}}
  ]
},
{
  time:"3:50 pm", pip:"3:50",
  title:"Then it goes wrong.",
  scene:["Something breaks. A person, a plan, a number that doesn't add up.",
         "Everyone looks around. You realise, with mild surprise, that it's yours."],
  prompt:"First move?",
  options:[
   {t:"Find whoever's most affected and talk to them", s:"The technical fix can wait ten minutes.",
    echo:"you go to the people first", a:{people:3, leading:1}},
   {t:"Get the facts before anyone starts guessing", s:"Opinions are already flying. You want the record.",
    echo:"you go to the evidence first", a:{analysis:3, order:2}},
   {t:"Start fixing it with your hands, right now", s:"Something needs to work again in twenty minutes.",
    echo:"you move first and think while moving", a:{hands:3, making:1}},
   {t:"Take charge of the room and assign the work", s:"Five people doing nothing is the actual problem.",
    echo:"you take the room", a:{leading:3}},
   {t:"Work out how to stop it happening a third time", s:"It's happened before. That's the real issue.",
    echo:"you fix the cause, not the incident", a:{order:3, analysis:2}}
  ]
},
{
  time:"5:40 pm", pip:"5:40",
  title:"You could go home now.",
  scene:["Nobody would notice. Nobody would mind.",
         "You stay anyway, for one specific reason."],
  prompt:"What keeps you?",
  options:[
   {t:"Someone's still stuck and you said you'd help", s:"You'd think about it all evening otherwise.",
    echo:"you stay for a person", a:{people:3}},
   {t:"You're close to understanding it", s:"Another forty minutes and it'll click.",
    echo:"you stay to understand it", a:{analysis:3}},
   {t:"It's nearly right and you can't leave it nearly right", s:"One more pass.",
    echo:"you stay to finish it properly", a:{making:2, order:2}},
   {t:"Tomorrow will be chaos unless you set it up now", s:"Twenty minutes tonight saves the whole morning.",
    echo:"you stay to protect tomorrow", a:{leading:2, order:2}},
   {t:"The job isn't finished and finished means finished", s:"You don't leave things half-done.",
    echo:"you stay because half-done isn't done", a:{hands:2, order:2}}
  ]
},
{
  time:"Rewind", pip:"today",
  title:"Now come back to today.",
  scene:["That was the day you'd want. This is the one question about the day you've actually got, and it decides which roles we show you."],
  prompt:"Where are you standing right now?",
  type:"level",
  options: Quiz.LEVELS.map(function(l){ return {t:l.t, s:l.s, level:l.k}; })
}
];
MOMENTS.forEach(function(m,i){ m.id = m.id || ("moment_" + i); });

/* ---------------- engine ---------------- */
let state = {i:0, axes:{}, echoes:[], level:"early"};
let history = [];
const app = document.getElementById('app');
const snap = ()=>JSON.parse(JSON.stringify(state));
function persist(){ Quiz.save({state:state, history:history}); }

function daybar(){
  const total = MOMENTS.length;
  const pct = state.i/(total-1)*100;
  return `<div class="daybar">
    <div class="sun"><span>Morning</span><span>Evening</span></div>
    <div class="track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}"
         aria-valuenow="${Math.min(state.i+1,total)}"
         aria-label="Moment ${Math.min(state.i+1,total)} of ${total}">
      <div class="fill" style="width:${Math.min(pct,100)}%"></div>
      ${MOMENTS.map((m,n)=>{
        const cls = n<state.i?'done':(n===state.i?'now':'');
        return `<div class="pip ${cls}" style="left:${n/(total-1)*100}%"><span>${m.pip}</span></div>`;
      }).join('')}
    </div>
  </div>`;
}

/* last three only — the full list became a wall by the evening */
function echoBlock(){
  if(!state.echoes.length) return '';
  const shown = state.echoes.slice(-3);
  const more = state.echoes.length - shown.length;
  return `<div class="echo"><b>Your day so far:</b> ${shown.join(' · ')}${more?` (+${more} earlier)`:''}</div>`;
}

function render(){
  if(state.i >= MOMENTS.length) return renderResults();
  const m = MOMENTS[state.i];
  app.className='card fade';
  app.innerHTML = daybar() + `<div class="pad">
    <div class="clock">${m.time}</div>
    <h2>${m.title}</h2>
    ${m.scene.map(s=>`<p class="scene">${s}</p>`).join('')}
    <div class="prompt">${m.prompt}</div>
    ${m.options.map((o,n)=>`<button type="button" class="choice" data-n="${n}">
        <span class="t">${o.t}</span><span class="s">${o.s}</span></button>`).join('')}
    ${state.i>0?'<button type="button" class="back" id="back">← back a moment</button>':''}
    ${echoBlock()}
  </div>`;

  app.querySelectorAll('[data-n]').forEach(el=>{
    el.onclick = ()=>{
      const o = m.options[+el.dataset.n];
      history.push(snap());
      if(o.a) for(const k in o.a) state.axes[k] = (state.axes[k]||0) + o.a[k];
      if(o.echo) state.echoes.push(o.echo);
      if(o.level) state.level = o.level;
      Quiz.trackStep(state.i, m.id, o.t);
      state.i++;
      persist();
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  const b = document.getElementById('back');
  if(b) b.onclick = goBack;
}

/* Lets the account bar's Back button step within the quiz instead of
   leaving it. Same two-function contract yns-activity.js publishes. */
window.YNSStepBack = {
  can: function(){ return history.length > 0 && state.i > 0; },
  go:  function(){ goBack(); }
};

function goBack(){
  if(!history.length) return;
  Quiz.track('back', {from_step: state.i});
  state = history.pop();
  persist();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderResults(){
  const scores = Quiz.score(state.axes);
  const all = Quiz.rank(scores);
  const pctOf = Quiz.pctScaler(all);
  const ranked = all.slice(0,3);
  const top = ranked[0].k;
  const levelWord = Quiz.LEVEL_WORD[state.level];
  const AXES = Quiz.AXES;

  const axMax = Math.max(...AXES.map(a=>state.axes[a.k]||0)) || 1;
  const shape = `<div class="shapewrap"><div class="shape">
    ${AXES.map(a=>{
      const h = Math.round(((state.axes[a.k]||0)/axMax)*100);
      return `<div style="height:${Math.max(h,4)}%"><i>${a.label}</i></div>`;
    }).join('')}
  </div></div>`;

  const topAx = [...AXES].sort((a,b)=>(state.axes[b.k]||0)-(state.axes[a.k]||0));
  const zeroAx = AXES.filter(a=>!(state.axes[a.k]));

  const labels=['Best match','Strong fit','Worth exploring'];
  const cards = ranked.map((r,n)=>{
    const c=Quiz.CATS[r.k];
    const roles=Quiz.rolesFor(r.k, state.level);
    return `<div class="result-card ${n===0?'best':''}">
      <span class="tag ${n===0?'':'alt'}">${labels[n]}</span>
      <h3>${c.name}</h3>
      <p class="why">${c.blurb}</p>
      <p class="fitline">${pctOf(r.v)}% match to the shape of your day</p>
      <div class="roles">
        <div class="rh">Roles matched to your ${levelWord} experience</div>
        ${roles.map(x=>`<div class="role"><span>${x[0]}</span><span class="pay">${x[1]}</span></div>`).join('')}
      </div></div>`;
  }).join('');

  app.className='card fade';
  app.innerHTML = daybar() + `<div class="pad">
    <div class="clock">Your day, read back</div>
    <h1>You're ${Quiz.ARCHETYPE[top]}.</h1>
    <p class="scene">${Quiz.ARCHETYPE_LINE[top]}</p>
    <p class="scene" style="margin-top:12px">
      Across six moments you leaned hardest on <b>${topAx[0].label.toLowerCase()}</b> and <b>${topAx[1].label.toLowerCase()}</b>${
        zeroAx.length ? `, and never once reached for <b>${zeroAx.map(a=>a.label.toLowerCase()).join(' or ')}</b>` : ''}.
      That shape is the whole result.
    </p>
    ${shape}
    <p class="scene" style="font-size:14px;color:var(--muted)">${state.echoes.join(' · ')}</p>
    ${Quiz.continuityHTML(top)}
    ${Quiz.shareHTML()}
    <div style="height:22px"></div>
    ${cards}
    ${Quiz.salaryNote()}
    <div class="cta">
      <h3>Want the full map?</h3>
      <p>The 90-day plan for getting from where you are to any of these, plus what to learn first.</p>
      ${Quiz.emailFormHTML()}
      <p style="margin:10px 0 0;font-size:12.5px">Or start the program, $9.99/month</p>
    </div>
    <button type="button" class="back" id="rback">← change my last answer</button>
    <button type="button" class="back" id="restart" style="margin-left:18px">↺ live a different day</button>
  </div>`;

  Quiz.wireEmailForm(app, {result: top, level: state.level, answers: state.echoes});
  Quiz.wireShare(app, top);
  document.getElementById('rback').onclick = goBack;
  document.getElementById('restart').onclick = ()=>{ Quiz.track('restart',{}); Quiz.clear(); location.reload(); };
  Quiz.finish({
    top: top,
    level: state.level,
    axes: state.axes,
    scores: scores,
    ranked: all.map(r=>r.k),
    answers: {echoes: state.echoes, history_len: history.length}
  });
  Quiz.clear();
}

/* Confirm rather than re-ask, if another activity already got this. */
function applyPriorLevel(){
  const prior = Quiz.priorLevel();
  if(!prior) return;
  state.level = prior;
  const m = MOMENTS[MOMENTS.length-1];
  m.title = "Still standing in the same place?";
  m.scene = ["You've told us this before. Tap the same one if it's still true, or pick the new one if it isn't."];
  m.options = m.options.map(o =>
    o.level === prior ? {...o, s: (o.s||'') + ". This is what you told us last time"} : o);
}

/* ---- resume an interrupted run ---- */
function offerResume(){
  const saved = Quiz.load(1000*60*60*24);
  if(saved && saved.state && saved.state.i > 0 && saved.state.i < MOMENTS.length){
    document.getElementById('resume').innerHTML =
      '<div class="q-resume">You were partway through your day. ' + MOMENTS[saved.state.i].time + '. ' +
      '<button type="button" id="r-yes">Pick up where I left off</button>' +
      '<button type="button" id="r-no">Start again</button></div>';
    document.getElementById('r-yes').onclick = ()=>{
      state = saved.state; history = saved.history || [];
      document.getElementById('resume').innerHTML='';
      Quiz.track('resume', {step: state.i}); render();
    };
    document.getElementById('r-no').onclick = ()=>{
      Quiz.clear(); document.getElementById('resume').innerHTML='';
    };
  }
}

READY.then(function(){
  applyPriorLevel();
  offerResume();
  render();
});
</script>
